services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - SCRIPTS_DIR=/data/scripts
      - PORT=3001
    volumes:
      - scripts_data:/data/scripts
    restart: unless-stopped

volumes:
  scripts_data:
