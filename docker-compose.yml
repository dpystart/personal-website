services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - /root/mydata/scripts:/root/mydata/scripts
    environment:
      - SCRIPTS_DIR=/root/mydata/scripts
      - PORT=3001
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
