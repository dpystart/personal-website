apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: personal-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: personal-website-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: SCRIPTS_DIR
              value: /mydata/scripts
            - name: PORT
              value: "3001"
          volumeMounts:
            - name: scripts-data
              mountPath: /mydata/scripts
            - name: tasks-data
              mountPath: /mydata/tasks
            - name: commands-data
              mountPath: /mydata/commands
      volumes:
        - name: scripts-data
          hostPath:
            path: /mydata/scripts
            type: DirectoryOrCreate
        - name: tasks-data
          hostPath:
            path: /mydata/tasks
            type: DirectoryOrCreate
        - name: commands-data
          hostPath:
            path: /mydata/commands
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: personal-website
spec:
  selector:
    app: backend
  ports:
    - port: 3001
      targetPort: 3001
